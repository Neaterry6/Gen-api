<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxora • AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
       .logo-font { font-family: 'Space Grotesk', sans-serif; }
       .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); }
       .light.glass { background: rgba(255,255,255,0.75); }
       .gradient-bg { background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #16213e); }
       .light.gradient-bg { background: linear-gradient(135deg, #f8fafc, #e0f2fe, #dbeafe); }
       .card-hover { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
       .card-hover:hover { transform: translateY(-12px) scale(1.02); }
       .tab-btn.active { background: rgb(255 255 255 / 0.15); }
       .nav-link.active { color: rgb(251 191 36); }
       .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="gradient-bg text-white min-h-screen pb-24">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 relative z-10">
        <header class="flex justify-between items-center py-8">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 bg-gradient-to-br from-yellow-400 to-amber-500 rounded-3xl flex items-center justify-center text-3xl font-bold logo-font">F</div>
                <span class="text-4xl font-bold logo-font">Fluxora</span>
            </div>
            <div class="flex gap-8 text-sm font-medium">
                <a href="#" onclick="showSection('create')" class="nav-link active">Create</a>
                <a href="#" onclick="showSection('gallery')" class="nav-link">Gallery</a>
                <a href="#" onclick="showSection('api')" class="nav-link">API</a>
            </div>
        </header>

        <div id="stats" class="grid grid-cols-3 gap-4 mb-10"></div>

        <div id="create-section">
            <div class="max-w-3xl mx-auto">
                <div class="text-center mb-10">
                    <h1 class="text-5xl font-bold logo-font">AI Studio</h1>
                    <p class="text-gray-400 mt-2">Free • Fast • API + Web</p>
                </div>
                <div class="flex bg-white/5 rounded-3xl p-1 mb-8 w-fit mx-auto">
                    <button onclick="switchMode(0)" id="tab-0" class="tab-btn px-6 py-3 rounded-3xl font-medium active">Image</button>
                    <button onclick="switchMode(1)" id="tab-1" class="tab-btn px-6 py-3 rounded-3xl font-medium">Video</button>
                    <button onclick="switchMode(2)" id="tab-2" class="tab-btn px-6 py-3 rounded-3xl font-medium">Chat</button>
                    <button onclick="switchMode(3)" id="tab-3" class="tab-btn px-6 py-3 rounded-3xl font-medium">Edit</button>
                </div>
                <div class="glass border-white/10 rounded-3xl p-8">
                    <textarea id="prompt" rows="4" class="w-full bg-transparent text-lg outline-none placeholder:text-gray-400" placeholder="A majestic cybernetic lion..."></textarea>
                    <input id="edit-image-url" type="url" placeholder="Image URL for edit mode" class="hidden w-full mt-4 bg-zinc-900 border-white/20 rounded-2xl px-5 py-3">
                    <div class="mt-6 grid-cols-2 gap-6">
                        <div>
                            <label class="text-xs text-gray-400 block mb-2">MODEL</label>
                            <select id="provider" class="w-full bg-zinc-900 border-white/20 rounded-2xl px-5 py-3">
                                <option value="pollinations">Pollinations Flux</option>
                                <option value="flux">FLUX Schnell</option>
                                <option value="sd3.5">SD 3.5</option>
                                <option value="nano-banana">Nano Banana</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs text-gray-400 block mb-2">DIMENSIONS</label>
                            <div class="flex gap-3">
                                <input type="number" id="width" value="1024" class="w-full bg-zinc-900 border-white/20 rounded-2xl px-5 py-3 text-center">
                                <span class="self-center">×</span>
                                <input type="number" id="height" value="1024" class="w-full bg-zinc-900 border-white/20 rounded-2xl px-5 py-3 text-center">
                            </div>
                        </div>
                    </div>
                    <button onclick="generate()" class="mt-8 w-full py-5 bg-gradient-to-r from-yellow-400 to-amber-500 text-black font-semibold rounded-3xl text-lg">
                        <span id="generate-btn-text">GENERATE IMAGE</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="gallery-section" class="hidden">
            <h2 class="text-4xl font-semibold mb-4">Your Gallery <span id="gallery-count" class="text-gray-400 text-lg"></span></h2>
            <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </div>

        <div id="api-section" class="hidden">
            <h2 class="text-5xl font-bold mb-3">API Docs</h2>
            <p class="text-gray-400 mb-6">Base: <code class="text-yellow-400">https://gen-sand-chi.vercel.app/api/generate</code></p>
            <pre class="bg-zinc-950 p-6 rounded-2xl"><code>GET /api/generate/pollinations/cute+cat/image
POST /api/generate/pollinations/explain+AI/chat</code></pre>
        </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
        <div class="max-w-4xl w-full bg-zinc-900 rounded-3xl overflow-hidden">
            <div id="modal-content" class="p-6"></div>
            <div class="p-6 flex gap-4"><button onclick="closeModal()" class="flex-1 py-4 border-white/30 rounded-2xl">Close</button></div>
        </div>
    </div>

    <script>
        const BASE_URL = '/api/generate'; // use relative path so it works on any domain
        let gallery = JSON.parse(localStorage.getItem('fluxora_gallery') || '[]');
        let currentMode = 0;
        const modes = [
            { btn: "GENERATE IMAGE", type: "image" },
            { btn: "GENERATE VIDEO", type: "video" },
            { btn: "SEND MESSAGE", type: "chat" },
            { btn: "EDIT IMAGE", type: "edit" }
        ];

        function saveGallery() { localStorage.setItem('fluxora_gallery', JSON.stringify(gallery)); }
        function renderStats() {
            document.getElementById('stats').innerHTML = `
                <div class="glass rounded-3xl p-6 text-center"><div class="text-5xl font-bold">${gallery.length}</div><div class="text-sm text-gray-400">Creations</div></div>
                <div class="glass rounded-3xl p-6 text-center"><div class="text-5xl font-bold">7</div><div class="text-sm text-gray-400">Models</div></div>
                <div class="glass rounded-3xl p-6 text-center"><div class="text-5xl font-bold">${gallery.filter(i=>i.favorite).length}</div><div class="text-sm text-gray-400">Favorites</div></div>`;
        }
        function renderGallery() {
            const container = document.getElementById('gallery-grid');
            document.getElementById('gallery-count').textContent = `${gallery.length} creations`;
            if (gallery.length === 0) return container.innerHTML = `<div class="col-span-full py-20 text-center text-gray-400">No creations yet</div>`;
            container.innerHTML = gallery.map((item, i) => `
                <div class="bg-zinc-900/70 rounded-3xl overflow-hidden card-hover">
                    <div onclick="openModal(${i})" class="cursor-pointer">
                        ${item.type === 'video'? `<video src="${item.url}" class="w-full aspect-video object-cover" muted></video>` :
                          item.type === 'chat'? `<div class="aspect-square p-4 text-sm line-clamp-2">${item.url.slice(0,200)}...</div>` :
                          `<img src="${item.url}" class="w-full aspect-square object-cover">`}
                    </div>
                    <div class="p-4"><p class="line-clamp-2 text-sm">${item.prompt}</p></div>
                </div>`).join('');
        }

        async function generate() {
            const prompt = document.getElementById('prompt').value.trim();
            if (!prompt) return alert("Enter a prompt");
            const provider = document.getElementById('provider').value;
            const type = modes[currentMode].type;
            const w = document.getElementById('width').value;
            const h = document.getElementById('height').value;
            const imageUrl = document.getElementById('edit-image-url').value.trim();

            showSection('gallery');
            let path = `${BASE_URL}/${provider}/${encodeURIComponent(prompt.replace(/ /g, '+'))}/${type}/${w}/${h}`;
            if (type === 'edit') {
                if (!imageUrl) return alert("Add image URL for edit");
                path += `///${encodeURIComponent(imageUrl)}`;
            }

            const res = await fetch(path, { method: 'POST' });
            const data = await res.json();
            if (!data.success) return alert(data.error);

            gallery.unshift({ url: data.url || data.response, prompt, timestamp: Date.now(), favorite: false, type });
            saveGallery();
            renderGallery();
            renderStats();
            document.getElementById('prompt').value = '';
        }

        function openModal(i) {
            const item = gallery[i];
            const content = document.getElementById('modal-content');
            content.innerHTML = item.type === 'chat'? `<div class="p-8 whitespace-pre-wrap">${item.url}</div>` :
                                item.type === 'video'? `<video src="${item.url}" controls class="w-full rounded-2xl"></video>` :
                                `<img src="${item.url}" class="w-full rounded-2xl">`;
            document.getElementById('modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        function switchMode(n) {
            currentMode = n;
            document.querySelectorAll('.tab-btn').forEach((btn, i) => btn.classList.toggle('active', i === n));
            document.getElementById('generate-btn-text').textContent = modes[n].btn;
            document.getElementById('edit-image-url').classList.toggle('hidden', n!== 3);
        }
        function showSection(s) {
            ['create','gallery','api'].forEach(x => document.getElementById(x+'-section').classList.toggle('hidden', x!== s));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.textContent.toLowerCase().includes(s)));
        }
        window.onload = () => { renderStats(); renderGallery(); };
    </script>
</body>
</html>
